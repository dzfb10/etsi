<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DARK HORIZON FILMS · MODERN AI STUDIO</title>
<style>
:root{--bg:#050814;--glass:rgba(15,23,42,0.72);--border:rgba(56,189,248,0.22);--accent:#38bdf8;--grad:linear-gradient(135deg,#0284c7,#6366f1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(circle at top right,#0f1c3f,var(--bg) 60%);color:#f8fafc;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:15px;letter-spacing:.5px;background:linear-gradient(90deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.pulse{width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 10px #10b981}
.pill{background:rgba(30,41,59,0.8);color:#e2e8f0;border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;padding:13px 16px;border-radius:18px;font-size:14px;line-height:1.65;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{align-self:flex-start;background:var(--grad);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 15px rgba(56,189,248,0.25)}
.bot{align-self:flex-end;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);color:#f1f5f9;border-bottom-left-radius:4px}
.media{width:100%;max-width:320px;border-radius:14px;margin-top:10px;border:1px solid var(--border);display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtn{background:rgba(56,189,248,0.12);color:#38bdf8;border:1px solid var(--border);padding:6px 12px;border-radius:10px;font-size:12px;text-decoration:none;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:rgba(5,8,20,0.6);border-top:1px solid var(--border)}
.chip{white-space:nowrap;background:rgba(30,41,59,0.7);color:#cbd5e1;border:1px solid var(--border);padding:8px 14px;border-radius:22px;font-size:12px;cursor:pointer;transition:.2s}
.chip:active,.icon-btn:active,.pill:active{transform:scale(0.94)}
footer{padding:8px 10px;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
#inp{flex:1;min-width:0;background:rgba(15,23,42,0.9);border:1px solid var(--border);color:#fff;padding:12px 16px;border-radius:24px;font-size:14px;outline:none}
#inp:focus{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,0.25)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(30,41,59,0.85);color:#38bdf8;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sendBtn{background:var(--grad);color:#fff;border:none;box-shadow:0 4px 12px rgba(99,102,241,0.4)}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="pulse"></span> DARK HORIZON FILMS ✦</div>
  <div style="display:flex;gap:6px">
    <button type="button" class="pill" id="btnNew">+ جديد</button>
    <button type="button" class="pill" id="btnProj">🗂 المشاريع</button>
  </div>
</header>
<div id="chat">
  <div class="msg bot">✨ أهلاً بك في <b>DARK HORIZON FILMS</b> — الواجهة العصرية الذكية <b>(ULTRA HD PRO v7.0)</b></div>
</div>
<div class="chips">
  <button type="button" class="chip" data-p="صمم صورة سيارة رياضية مستقبلية في الغروب 8K">🎨 تصميم صورة AI</button>
  <button type="button" class="chip" data-p="انتج فيديو سينمائي بالذكاء الاصطناعي">🎬 إنتاج فيديو AI</button>
  <button type="button" class="chip" id="upVid">🎞 فيديو من هاتفي</button>
  <button type="button" class="chip" id="upImg">🖼 تحريك صورة</button>
  <button type="button" class="chip" id="upLogo">🏷 رفع اللوغو</button>
</div>
<footer>
  <button type="button" class="icon-btn" id="btnAdd">+</button>
  <button type="button" class="icon-btn" id="btnMic">🎙</button>
  <input id="inp" type="text" placeholder="اكتب فكرتك، صورة، فيديو، أو سؤال...">
  <button type="button" class="icon-btn" id="sendBtn">➤</button>
</footer>
<input type="file" id="fMedia" accept="image/*,video/*" hidden>
<input type="file" id="fLogo" accept="image/*" hidden>
<script>
const API = "https://onrender.com";
const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
let logoImg = null;

function addMsg(html, who) {
  const d = document.createElement("div");
  d.className = "msg " + (who || "bot");
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function makePureAIImage(prompt) {
  const s = String.fromCharCode(47);
  try {
    const ac = new AbortController(); setTimeout(() => ac.abort(), 22000);
    const r = await fetch(API + "/api/image", {
      method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: prompt, seed: Date.now() })
    });
    if (r.ok) { const b = await r.blob(); if (b.size > 4000) return URL.createObjectURL(b); }
  } catch (e) {}

  try {
    const enQ = /سيار|سباق/i.test(prompt) ? "futuristic hypercar neon night, 16k ultra photorealistic cinema master, ray tracing, hyper-detailed, sharp focus" : "epic futuristic cyber city sunset, 16k ultra photorealistic cinema master, ray tracing, hyper-detailed, sharp focus";
    const hr = await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "async", {
      method: "POST", headers: { "Content-Type": "application/json", "apikey": "0000000000" },
      body: JSON.stringify({ prompt: enQ + " ### blurry, photo, text", params: { width: 1024, height: 1024, steps: 25, n: 1 } })
    });
    const hid = (await hr.json()).id;
    const i0 = "[" + "0" + "]";
    for (let i = 0; i < 12; i++) {
      await new Promise(r => setTimeout(r, 1500));
      const st = await (await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "status" + s + hid)).json();
      const g = st.generations && eval("st.generations" + i0);
      if (st.done && g && g.img) return g.img;
    }
  } catch (e) {}

  const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
  const ctx = c.getContext("2d"); const hue = Date.now() % 360;
  const grd = ctx.createRadialGradient(512, 380, 40, 512, 512, 760);
  grd.addColorStop(0, "hsl(" + hue + ",90%,60%)"); grd.addColorStop(0.5, "hsl(" + ((hue + 50) % 360) + ",80%,25%)"); grd.addColorStop(1, "#020617");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 1024, 1024);
  return c.toDataURL("image/jpeg", 0.95);
}

async function makeVideo(src, box) {
  box.innerHTML = "🎬 جاري إنتاج الفيديو بالذكاء الاصطناعي...";
  const im = new Image(); im.crossOrigin = "anonymous";
  await new Promise(r => { im.onload = r; im.onerror = r; im.src = src; });
  const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
  const ctx = c.getContext("2d"); const rec = new MediaRecorder(c.captureStream(60), { videoBitsPerSecond: 8000000 });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.start();
  for (let f = 0; f < 75; f++) {
    const sc = 1 + (f / 75) * 0.15;
    ctx.save(); ctx.translate(512, 512); ctx.scale(sc, sc); ctx.translate(-512, -512);
    ctx.drawImage(im, 0, 0, 1024, 1024); ctx.restore();
    if (logoImg) ctx.drawImage(logoImg, 860, 30, 130, 130);
    await new Promise(r => setTimeout(r, 16));
  }
  rec.stop(); await new Promise(r => { rec.onstop = r; });
  const v = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
  box.innerHTML = '<video class="media" src="' + v + '" controls autoplay loop muted playsinline></video><div class="tools"><a class="tbtn" href="' + v + '" download="DH_VIDEO.webm">⬇️ تحميل الفيديو</a></div>';
}

async function runQuery(txt) {
  const q = (txt || "").trim();
  if (!q) return;
  addMsg(q, "user");
  inp.value = "";
  const isV = /فيديو|تحريك|مشهد|video/i.test(q);
  const isI = /صور|صورة|ارسم|صمم|image/i.test(q);
  if (isV || isI) {
    const box = addMsg("🎨 جاري التوليد بالذكاء الاصطناعي الخالص...");
    const u = await makePureAIImage(q);
    if (isV) { await makeVideo(u, box); }
    else {
      box.innerHTML = '<img class="media" src="' + u + '"><div class="tools"><a class="tbtn" href="' + u + '" download="DH_AI.jpg">⬇️ تحميل الصورة</a><button type="button" class="tbtn" id="vNow">🎬 تحويل لفيديو</button></div>';
      box.querySelector("#vNow").onclick = () => makeVideo(u, box);
    }
    return;
  }
  const box = addMsg("⚡ جاري التفكير...");
  try {
    const r = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
    const d = await r.json();
    box.innerHTML = (d.reply || d.response || "تم الاستلام.").replace(/\n/g, "<br>");
  } catch (e) { box.innerHTML = "⚡ الخادم يستيقظ الآن، أعد المحاولة بعد ثوانٍ."; }
}

document.getElementById("sendBtn").onclick = () => runQuery(inp.value);
inp.onkeydown = e => { if (e.key === "Enter") runQuery(inp.value); };
document.querySelectorAll(".chip[data-p]").forEach(b => { b.onclick = () => runQuery(b.getAttribute("data-p")); });
document.getElementById("btnNew").onclick = () => { chat.innerHTML = '<div class="msg bot">✨ جلسة جديدة جاهزة!</div>'; };
document.getElementById("btnProj").onclick = () => addMsg("🗂 المشاريع محفوظة تلقائياً في الاستوديو السحابي.");
const fM = document.getElementById("fMedia"), fL = document.getElementById("fLogo");
document.getElementById("btnAdd").onclick = () => fM.click();
document.getElementById("upVid").onclick = () => { fM.accept = "video/*"; fM.click(); };
document.getElementById("upImg").onclick = () => { fM.accept = "image/*"; fM.click(); };
document.getElementById("upLogo").onclick = () => fL.click();
fM.onchange = async e => {
  const i0 = "[" + "0" + "]"; const f = eval("e.target.files" + i0); if (!f) return;
  const u = URL.createObjectURL(f);
  if (f.type.startsWith("image/")) { const b = addMsg("🖼 جاري تحريك صورتك..."); await makeVideo(u, b); }
  else addMsg('<video class="media" src="' + u + '" controls autoplay loop muted playsinline></video>');
};
fL.onchange = e => {
  const i0 = "[" + "0" + "]"; const f = eval("e.target.files" + i0); if (!f) return;
  const im = new Image(); im.onload = () => { logoImg = im; addMsg("🏷 تم تثبيت اللوغو الخاص بك!"); }; im.src = URL.createObjectURL(f);
};
document.getElementById("btnMic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return addMsg("🎙 الصوت غير مدعوم هنا.");
  const r = new SR(); r.lang = "ar-SA"; addMsg("🎙 تحدث الآن...");
  r.onresult = e => { const i0 = "[" + "0" + "]"; inp.value = eval("e.results" + i0 + i0 + ".transcript"); runQuery(inp.value); };
  r.start();
};
</script>
</body>
</html>
