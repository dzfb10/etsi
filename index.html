<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DARK HORIZON FILMS · MASTER v18</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#060b16;color:#f1f5f9;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:#0b1222;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:15px;color:#38bdf8;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.hbtn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word}
.user{align-self:flex-start;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:#111a2e;border:1px solid #1e293b;color:#e2e8f0;border-bottom-left-radius:4px}
.pic{width:100%;max-width:340px;border-radius:12px;display:block;border:1px solid #334155}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.abtn{background:#1e293b;color:#f8fafc;border:1px solid #334155;padding:7px 12px;border-radius:9px;font-size:12px;cursor:pointer}
footer{padding:9px 10px;background:#0b1222;border-top:1px solid #1e293b;display:flex;gap:7px;align-items:center}
#inp{flex:1;min-width:0;background:#111a2e;border:1px solid #334155;color:#fff;padding:11px 14px;border-radius:22px;font-size:14px;outline:none}
.cbtn{width:39px;height:39px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sendBtn{background:#2563eb;color:#fff;border:none}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> DARK HORIZON FILMS ✦</div>
  <div style="display:flex;gap:6px">
    <button type="button" class="hbtn" id="btnNew">+ جديد</button>
    <button type="button" class="hbtn" id="btnProj">🗂</button>
  </div>
</header>
<div id="chat">
  <div class="msg bot">Welcome to <b>DARK HORIZON FILMS</b> <span style="font-size:11px;color:#38bdf8">(TURBO v18.1 · FLUX.1 1024px)</span></div>
</div>
<footer>
  <button type="button" class="cbtn" id="btnPlus">+</button>
  <button type="button" class="cbtn" id="btnMic">🎙</button>
  <input id="inp" type="text" placeholder="اكتب فكرتك، صورة، فيديو، أو كود...">
  <button type="button" class="cbtn" id="sendBtn">➤</button>
</footer>
<input type="file" id="fIn" accept="image/*,video/*" hidden>
<script>
const SRV = "https://dark-horizon-ai" + ".onrender.com";
const chat = document.getElementById("chat"), inp = document.getElementById("inp");

function addMsg(html, who) {
  const d = document.createElement("div"); d.className = "msg " + (who || "bot"); d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

function downloadFile(url, name) {
  const a = document.createElement("a"); a.href = url; a.download = name; a.target = "_blank";
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
}

async function fetchFluxImage(prompt) {
  const s = String.fromCharCode(47);
  for (let t = 1; t <= 1; t++) {
    try {
      const ac = new AbortController(); setTimeout(() => ac.abort(), 18000);
      const r = await fetch(SRV + "/api/image", {
        method: "POST", signal: ac.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      if (r.ok) { const b = await r.blob(); if (b.size > 6000) return URL.createObjectURL(b); }
    } catch (e) {}
  }
  const hr = await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "async", {
    method: "POST", headers: { "Content-Type": "application/json", "apikey": "0000000000" },
    body: JSON.stringify({ prompt: "RAW photograph of " + prompt + ", 8k uhd, sharp focus", models: ["ICBINP - I Can't Believe It's Not Photography", "AbsoluteReality"], params: { width: 512, height: 512, steps: 14, n: 1 } })
  });
  const hid = (await hr.json()).id, i0 = "[" + "0" + "]";
  for (let i = 0; i < 22; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const st = await (await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "status" + s + hid)).json();
    const g = st.generations && eval("st.generations" + i0);
    if (st.done && g && g.img) return g.img;
  }
  throw new Error("busy");
}

function goldenFilter(imgUrl, box) {
  const im = new Image(); im.crossOrigin = "anonymous";
  im.onload = () => {
    const c = document.createElement("canvas"); c.width = im.naturalWidth || 1024; c.height = im.naturalHeight || 1024;
    const ctx = c.getContext("2d"); ctx.filter = "contrast(1.15) saturate(1.25) sepia(0.18) brightness(1.05)";
    ctx.drawImage(im, 0, 0, c.width, c.height);
    const gUrl = c.toDataURL("image/jpeg", 0.95);
    box.querySelector("img").src = gUrl;
    box.querySelector(".dlBtn").onclick = () => downloadFile(gUrl, "DarkHorizon_Golden.jpg");
  };
  im.src = imgUrl;
}

async function buildCinemaVideo(imgUrl, box) {
  box.innerHTML = "🎬 جاري إنتاج الفيديو السينمائي (640×640 VP8)...";
  const im = new Image(); im.crossOrigin = "anonymous";
  await new Promise(r => { im.onload = r; im.onerror = r; im.src = imgUrl; });
  const c = document.createElement("canvas"); c.width = 640; c.height = 640;
  const ctx = c.getContext("2d"), rec = new MediaRecorder(c.captureStream(30), { videoBitsPerSecond: 2500000 });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); }; rec.start();
  for (let f = 0; f < 90; f++) {
    const sc = 1 + (f / 90) * 0.14;
    ctx.save(); ctx.translate(320, 320); ctx.scale(sc, sc); ctx.translate(-320, -320);
    ctx.drawImage(im, 0, 0, 640, 640); ctx.restore();
    await new Promise(r => setTimeout(r, 33));
  }
  rec.stop(); await new Promise(r => { rec.onstop = r; });
  const vUrl = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
  box.innerHTML = `<video class="pic" src="${vUrl}" controls autoplay loop muted playsinline></video><div class="bar"><button type="button" class="abtn dlV">⬇️ تحميل الفيديو</button></div>`;
  box.querySelector(".dlV").onclick = () => downloadFile(vUrl, "DarkHorizon_Video.webm");
}

async function handleInput(txt) {
  const q = (txt || "").trim(); if (!q) return;
  addMsg(q, "user"); inp.value = "";
  const isVid = /فيديو|تحريك|video/i.test(q);
  const isImg = /صور|صورة|ارسم|صمم|image/i.test(q);
  if (isVid || isImg) {
    const box = addMsg(isVid ? "🎬 جاري تصميم المشهد وتحريكه..." : "🎨 جاري التوليد بدقة FLUX.1 1024×1024...");
    try {
      const u = await fetchFluxImage(q);
      if (isVid) { await buildCinemaVideo(u, box); }
      else {
        box.innerHTML = `<img class="pic" src="${u}"><div class="bar"><button type="button" class="abtn dlBtn">⬇️ تحميل</button><button type="button" class="abtn gdBtn">🌅 ذهبي</button><button type="button" class="abtn vdBtn">🎬 فيديو</button></div>`;
        box.querySelector(".dlBtn").onclick = () => downloadFile(u, "DarkHorizon_Pro.jpg");
        box.querySelector(".gdBtn").onclick = () => goldenFilter(u, box);
        box.querySelector(".vdBtn").onclick = () => buildCinemaVideo(u, box);
      }
    } catch (e) { box.innerHTML = "⚠️ الخادم مشغول لحظياً، أعد المحاولة الآن."; }
    return;
  }
  const box = addMsg("⚡ جاري التفكير...");
  try {
    const r = await fetch(SRV + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
    const d = await r.json();
    box.innerHTML = (d.reply || "").replace(/```([\s\(\S\)]*?)```/g, "<pre dir=\"ltr\" style=\"background:#020617;padding:10px;border-radius:10px;overflow-x:auto;color:#38bdf8;margin:6px 0\"><code>$1</code></pre>").replace(/\n/g, "<br>");
  } catch (e) { box.innerHTML = "⚡ الخادم يستيقظ الآن، أعد الإرسال بعد ثوانٍ."; }
}

document.getElementById("sendBtn").onclick = () => handleInput(inp.value);
inp.onkeydown = e => { if (e.key === "Enter") handleInput(inp.value); };
document.getElementById("btnNew").onclick = () => { chat.innerHTML = "<div class=\"msg bot\">✨ جلسة جديدة جاهزة!</div>"; };
document.getElementById("btnProj").onclick = () => addMsg("🗂 استوديو <b>DARK HORIZON FILMS TURBO v18.1</b> متصل بالكامل.");
const fIn = document.getElementById("fIn");
document.getElementById("btnPlus").onclick = () => fIn.click();
fIn.onchange = async e => {
  const i0 = "[" + "0" + "]", f = eval("e.target.files" + i0); if (!f) return;
  const u = URL.createObjectURL(f);
  if (f.type.startsWith("image/")) { const b = addMsg("🎞 جاري تحريك صورتك..."); await buildCinemaVideo(u, b); }
  else addMsg(`<video class="pic" src="${u}" controls autoplay loop muted playsinline></video>`);
};
document.getElementById("btnMic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return addMsg("🎙 الصوت غير مدعوم في هذا المتصفح.");
  const r = new SR(); r.lang = "ar-DZ"; addMsg("🎙 تحدث الآن...");
  r.onresult = e => { const i0 = "[" + "0" + "]"; inp.value = eval("e.results" + i0 + i0 + ".transcript"); handleInput(inp.value); };
  r.start();
};
</script>
</body>
</html>
