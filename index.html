<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DARK HORIZON FILMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}body{background:#060b16;color:#f1f5f9;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:#0b1222;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:15px;color:#38bdf8;display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.hbtn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word}
.user{align-self:flex-start;background:#2563eb;color:#fff;border-bottom-right-radius:4px}.bot{align-self:flex-end;background:#111a2e;border:1px solid #1e293b;color:#e2e8f0;border-bottom-left-radius:4px}
.pic{width:100%;max-width:340px;border-radius:12px;display:block;border:1px solid #334155}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act-btn{background:#1e293b;color:#f8fafc;border:1px solid #334155;padding:7px 12px;border-radius:9px;font-size:12px;cursor:pointer;text-decoration:none}
footer{padding:9px 10px;background:#0b1222;border-top:1px solid #1e293b;display:flex;gap:7px;align-items:center;flex-wrap:nowrap}#inp{flex:1;min-width:0;background:#111a2e;border:1px solid #334155;color:#fff;padding:11px 14px;border-radius:22px;font-size:14px;outline:none}
.cbtn{width:39px;height:39px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}#send{background:#2563eb;color:#fff;border:none}
</style></head><body>
<header><div class="brand"><span class="dot"></span> DARK HORIZON FILMS ✦</div><button type="button" class="hbtn" id="btnNew">+ جديد</button></header>
<div id="chat"><div class="msg bot">Welcome to <b>DARK HORIZON FILMS</b> <span style="font-size:11px;color:#38bdf8">(ORIGINAL PURE CORE)</span></div></div>
<footer><button type="button" class="cbtn" id="btnPlus">+</button><button type="button" class="cbtn" id="btnMic">🎙</button><input id="inp" type="text" placeholder="اكتب فكرتك، صورة، فيديو، أو كود..."><button type="button" class="cbtn" id="send">➤</button></footer>
<input type="file" id="fIn" accept="image/*" hidden>
<script>
const API="https://onrender.com",chat=document.getElementById("chat"),inp=document.getElementById("inp");
fetch(API+"/").catch(()=>{});
function addBot(h){const d=document.createElement("div");d.className="msg bot";d.innerHTML=h;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function addUser(t){const d=document.createElement("div");d.className="msg user";d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function makeFastVideo(imgUrl,bubble,sec){
  const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{
    const W=480,H=480,c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
    const rec=new MediaRecorder(c.captureStream(24),{mimeType:"video/webm"}),chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{const vu=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));bubble.innerHTML=`<video src="${vu}" controls autoplay loop playsinline class="pic"></video><div class="actions"><a class="act-btn" href="${vu}" download="DarkHorizon_Film.webm">⬇️ حفظ الفيديو</a></div>`};
    rec.start();let f=0,total=sec*24;
    const iv=setInterval(()=>{const p=f/total,z=1+p*0.12,w=W*z,h=H*z;ctx.clearRect(0,0,W,H);ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);if(++f>=total){clearInterval(iv);rec.stop()}},1000/24);
  };im.src=imgUrl;
}
async function playTTS(btn){
  const txt=btn.parentElement.parentElement.innerText.replace(/استماع|نسخ/g,"").trim();btn.textContent="⏳";
  try{const r=await fetch(API+"/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:txt})});const a=new Audio(URL.createObjectURL(await r.blob()));a.onended=()=>btn.textContent="🎧 استماع";a.play()}catch(e){btn.textContent="🎧 استماع"}
}
async function sendMsg(){
  const val=inp.value.trim();if(!val)return;inp.value="";addUser(val);const box=addBot("⚡...");
  const isIdea=/فكرة|فكره|idea|script/i.test(val)&&!/صمم|صورة|صور|ارسم|فيديو|video/i.test(val);
  if(!isIdea&&/صمم|صورة|صور|ارسم|فيديو|image|video/i.test(val)){
    const isVid=/فيديو|video/i.test(val);
    try{
      const r=await fetch(API+"/api/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:val})});
      if(r.ok){
        const url=URL.createObjectURL(await r.blob());
        if(isVid){box.innerHTML="🎬 جاري التحريك...";makeFastVideo(url,box,5)}
        else{box.innerHTML=`<img src="${url}" class="pic"><div class="actions"><a class="act-btn" href="${url}" download="DH_1.jpg">⬇️ حفظ</a><button type="button" class="act-btn toV">🎬 فيديو</button></div>`;box.querySelector(".toV").onclick=()=>{box.innerHTML="🎬...";makeFastVideo(url,box,5)}}
      }else{box.innerHTML="⚠️ الخادم مشغول، أعد المحاولة."}
    }catch(e){box.innerHTML="⚠️ تعذر الاتصال."}return;
  }
  try{
    const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:val,message:val})});
    const d=await r.json(),rep=d.reply||"⚡ جاهز.";
    box.innerHTML=`<div>${rep.replace(/\n/g,"<br>")}</div><div class="actions"><button type="button" class="act-btn tts">🎧 استماع</button><button type="button" class="act-btn cp">📋 نسخ</button></div>`;
    box.querySelector(".tts").onclick=function(){playTTS(this)};
    box.querySelector(".cp").onclick=function(){navigator.clipboard.writeText(rep);this.textContent="✅"};
  }catch(e){box.innerHTML="⚠️ أعد الإرسال."}
}
document.getElementById("send").onclick=sendMsg;inp.onkeydown=e=>{if(e.key==="Enter")sendMsg()};
document.getElementById("btnNew").onclick=()=>{chat.innerHTML='<div class="msg bot">✨ جلسة جديدة جاهزة!</div>'};
const fIn=document.getElementById("fIn");document.getElementById("btnPlus").onclick=()=>fIn.click();
fIn.onchange=e=>{const f=e.target.files.item(0);if(f)makeFastVideo(URL.createObjectURL(f),addBot("🎬 جاري تحريك صورتك..."),5)};
document.getElementById("btnMic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();r.lang="ar-DZ";r.onresult=e=>{inp.value=e.results.item(0).item(0).transcript;sendMsg()};r.start()};
</script></body></html>
