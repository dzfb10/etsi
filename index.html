<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DARK HORIZON FILMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#060b16;color:#f1f5f9;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 14px;background:#0b1222;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:14px;color:#38bdf8;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#10b981}
.hbtn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:5px 10px;border-radius:9px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px}.msg{max-width:88%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.55;word-wrap:break-word}
.user{align-self:flex-start;background:#2563eb;color:#fff}.bot{align-self:flex-end;background:#111a2e;border:1px solid #1e293b}.pic{width:100%;max-width:330px;border-radius:11px;display:block}
.bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.abtn{background:#1e293b;color:#f8fafc;border:1px solid #334155;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer}
.qbar{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:#080e1c;border-top:1px solid #1e293b}.qchip{white-space:nowrap;background:#111c33;color:#cbd5e1;border:1px solid #233354;padding:6px 11px;border-radius:16px;font-size:11px;cursor:pointer}}
footer{padding:8px 9px;background:#0b1222;border-top:1px solid #1e293b;display:flex;gap:6px;align-items:center}#inp{flex:1;min-width:0;background:#111a2e;border:1px solid #334155;color:#fff;padding:10px 13px;border-radius:20px;font-size:14px;outline:none}
.cbtn{width:37px;height:37px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}#sendBtn{background:#2563eb;color:#fff;border:none}
</style></head><body>
<header><div class="brand"><span class="dot"></span> DARK HORIZON FILMS ✦</div><div style="display:flex;gap:5px"><button type="button" class="hbtn" id="btnNew">+ جديد</button><button type="button" class="hbtn" id="btnProj">🗂</button></div></header>
<div id="chat"><div class="msg bot">🚀 <b>DARK HORIZON FILMS</b> <span style="font-size:11px;color:#38bdf8">(ULTIMATE v24.0)</span></div></div>
<div class="qbar"><button type="button" class="qchip" data-p="صمم صورة سيارة مرسيدس خارقة في الغروب 8K">🎨 صورة 8K</button><button type="button" class="qchip" data-p="انتج فيديو سينمائي لمدينة مستقبلية">🎬 فيديو AI</button><button type="button" class="qchip" id="btnRemix">🪄 تعديل صورة</button><button type="button" class="qchip" id="btnLogo">🏷 رفع اللوغو</button></div>
<footer><button type="button" class="cbtn" id="btnPlus">+</button><button type="button" class="cbtn" id="btnMic">🎙</button><input id="inp" type="text" placeholder="اكتب فكرتك، صورة، فيديو، أو كود..."><button type="button" class="cbtn" id="sendBtn">➤</button></footer>
<input type="file" id="fIn" accept="image/*,video/*" hidden><input type="file" id="fLogo" accept="image/*" hidden>
<script>
const SRV = "https://dark-horizon-ai" + ".onrender.com", chat = document.getElementById("chat"), inp = document.getElementById("inp");
let logoImg = null, upMode = "anim"; fetch(SRV + "/").catch(() => {});
function addMsg(h, w) { const d = document.createElement("div"); d.className = "msg " + (w || "bot"); d.innerHTML = h; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
function dlFile(u, n) { const a = document.createElement("a"); a.href = u; a.download = n; a.target = "_blank"; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500); }
async function fetchBestImage(p) {
  const s = String.fromCharCode(47);
  const raceRender = async () => {
    const ac = new AbortController(); setTimeout(() => ac.abort(), 30000);
    const r = await fetch(SRV + "/api/image", { method: "POST", signal: ac.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: p }) });
    if (!r.ok) throw new Error("render"); const b = await r.blob(); if (b.size < 6000) throw new Error("small"); return URL.createObjectURL(b);
  };
  const raceHorde = async () => {
    const hr = await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "async", {
      method: "POST", headers: { "Content-Type": "application/json", "apikey": "0000000000" },
      body: JSON.stringify({ prompt: p + ", 8k photorealistic ### blurry, cartoon", models: ["Juggernaut XL", "AlbedoBase XL (SDXL)", "DreamShaper XL", "EpicRealism"], params: { width: 512, height: 512, steps: 18, n: 1 } })
    });
    if (!hr.ok) throw new Error("horde"); const hid = (await hr.json()).id, i0 = "[" + "0" + "]";
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 1500));
      const st = await (await fetch("https:" + s + s + "stablehorde.net" + s + "api" + s + "v2" + s + "generate" + s + "status" + s + hid)).json();
      const g = st.generations && eval("st.generations" + i0); if (st.done && g && g.img) return g.img;
    }
    throw new Error("timeout");
  };
  return await Promise.any([raceRender(), raceHorde()]);
}
function upscale2K(u, box) {
  const im = new Image(); im.crossOrigin = "anonymous";
  im.onload = () => {
    const c = document.createElement("canvas"); c.width = 2048; c.height = 2048;
    const ctx = c.getContext("2d"); ctx.imageSmoothingQuality = "high"; ctx.filter = "contrast(1.12) saturate(1.15)";
    ctx.drawImage(im, 0, 0, 2048, 2048); if (logoImg) ctx.drawImage(logoImg, 1780, 40, 220, 220);
    const hu = c.toDataURL("image/jpeg", 0.96); box.querySelector("img").src = hu;
    box.querySelector(".dlB").onclick = () => dlFile(hu, "DarkHorizon_2K_HD.jpg");
  }; im.src = u;
}
async function buildVid(u, box) {
  box.innerHTML = "🎬 جاري إنتاج الفيديو..."; const im = new Image(); im.crossOrigin = "anonymous";
  await new Promise(r => { im.onload = r; im.onerror = r; im.src = u; });
  const c = document.createElement("canvas"); c.width = 640; c.height = 640;
  const ctx = c.getContext("2d"), rec = new MediaRecorder(c.captureStream(30), { videoBitsPerSecond: 2500000 }), ch = [];
  rec.ondataavailable = e => { if (e.data.size) ch.push(e.data); }; rec.start();
  for (let f = 0; f < 90; f++) {
    const sc = 1 + (f / 90) * 0.14; ctx.save(); ctx.translate(320, 320); ctx.scale(sc, sc); ctx.translate(-320, -320);
    ctx.drawImage(im, 0, 0, 640, 640); ctx.restore(); if (logoImg) ctx.drawImage(logoImg, 530, 20, 90, 90);
    await new Promise(r => setTimeout(r, 33));
  }
  rec.stop(); await new Promise(r => { rec.onstop = r; });
  const vu = URL.createObjectURL(new Blob(ch, { type: "video/webm" }));
  box.innerHTML = `<video class="pic" src="${vu}" controls autoplay loop muted playsinline></video><div class="bar"><button type="button" class="abtn dlV">⬇️ تحميل الفيديو</button></div>`;
  box.querySelector(".dlV").onclick = () => dlFile(vu, "DarkHorizon_Video.webm");
}
async function run(t) {
  const q = (t || "").trim(); if (!q) return; addMsg(q, "user"); inp.value = "";
  const mem = JSON.parse(localStorage.getItem("dh_hist") || "[]"); mem.unshift(q); localStorage.setItem("dh_hist", JSON.stringify(mem.slice(0, 15)));
  if (/فيديو|تحريك|video/i.test(q) || /صور|صورة|ارسم|صمم|image/i.test(q)) {
    const isV = /فيديو|تحريك|video/i.test(q), box = addMsg(isV ? "🎬 جاري تصميم المشهد..." : "🎨 جاري التوليد بالمحركات الـ 10...");
    try {
      const u = await fetchBestImage(q); if (isV) return await buildVid(u, box);
      box.innerHTML = `<img class="pic" src="${u}"><div class="bar"><button type="button" class="abtn dlB">⬇️ تحميل</button><button type="button" class="abtn hdB">✨ 2K HD</button><button type="button" class="abtn gdB">🌅 ذهبي</button><button type="button" class="abtn vdB">🎬 فيديو</button></div>`;
      box.querySelector(".dlB").onclick = () => dlFile(u, "DarkHorizon_Pro.jpg");
      box.querySelector(".hdB").onclick = () => upscale2K(u, box);
      box.querySelector(".gdB").onclick = () => { box.querySelector("img").style.filter = "contrast(1.15) saturate(1.25) sepia(0.2)"; };
      box.querySelector(".vdB").onclick = () => buildVid(u, box);
    } catch (e) { box.innerHTML = "⚠️ تعذر الاتصال لحظياً، أعد الإرسال الآن."; }
    return;
  }
  const box = addMsg("⚡ جاري التفكير...");
  try { const r = await fetch(SRV + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) }); box.innerHTML = ((await r.json()).reply || "").replace(/\n/g, "<br>"); } catch (e) { box.innerHTML = "⚡ الخادم يستيقظ، أعد المحاولة."; }
}
document.getElementById("sendBtn").onclick = () => run(inp.value);
inp.onkeydown = e => { if (e.key === "Enter") run(inp.value); };
document.querySelectorAll(".qchip[data-p]").forEach(b => { b.onclick = () => run(b.getAttribute("data-p")); });
document.getElementById("btnNew").onclick = () => { chat.innerHTML = "<div class=\"msg bot\">✨ جلسة جديدة جاهزة!</div>"; };
document.getElementById("btnProj").onclick = () => { const m = JSON.parse(localStorage.getItem("dh_hist") || "[]"); addMsg(m.length ? "🗂 <b>المشاريع المحفوظة:</b><br>• " + m.slice(0, 6).join("<br>• ") : "🗂 لا توجد مشاريع بعد."); };
const fIn = document.getElementById("fIn"), fLogo = document.getElementById("fLogo");
document.getElementById("btnPlus").onclick = () => { upMode = "anim"; fIn.click(); };
document.getElementById("btnRemix").onclick = () => { upMode = "remix"; fIn.accept = "image/*"; fIn.click(); };
document.getElementById("btnLogo").onclick = () => fLogo.click();
fLogo.onchange = e => { const i0 = "[" + "0" + "]", f = eval("e.target.files" + i0); if (!f) return; const im = new Image(); im.onload = () => { logoImg = im; addMsg("🏷 تم تثبيت اللوغو الخاص بك!"); }; im.src = URL.createObjectURL(f); };
fIn.onchange = async e => {
  const i0 = "[" + "0" + "]", f = eval("e.target.files" + i0); if (!f) return; const u = URL.createObjectURL(f);
  if (upMode === "remix") {
    const b = addMsg("🪄 جاري تعديل صورتك..."), rd = new FileReader();
    rd.onload = async () => {
      try { const r = await fetch(SRV + "/api/remix", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: rd.result, prompt: inp.value || "cinematic golden sunset" }) }); if (r.status === 200) { const nu = URL.createObjectURL(await r.blob()); b.innerHTML = `<img class="pic" src="${nu}">`; return; } } catch (err) {}
      await buildVid(u, b);
    }; rd.readAsDataURL(f);
  } else if (f.type.startsWith("image/")) await buildVid(u, addMsg("🎞 جاري تحريك صورتك..."));
  else addMsg(`<video class="pic" src="${u}" controls autoplay loop muted playsinline></video>`);
};
document.getElementById("btnMic").onclick = () => { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return; const r = new SR(); r.lang = "ar-DZ"; r.onresult = e => { const i0 = "[" + "0" + "]"; inp.value = eval("e.results" + i0 + i0 + ".transcript"); run(inp.value); }; r.start(); };
</script></body></html>
