<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DARK HORIZON FILMS · ULTRA AI v12</title>
<style>
:root{--bg:#040712;--glass:rgba(13,20,38,0.78);--border:rgba(56,189,248,0.25);--grad:linear-gradient(135deg,#0284c7,#7c3aed)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(circle at top right,#102048,var(--bg) 60%);color:#f8fafc;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 14px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:14px;background:linear-gradient(90deg,#38bdf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 10px #10b981}
.pill{background:rgba(30,41,59,0.85);color:#e2e8f0;border:1px solid var(--border);padding:5px 11px;border-radius:18px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word}
.user{align-self:flex-start;background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:var(--glass);border:1px solid var(--border);color:#f1f5f9;border-bottom-left-radius:4px}
.media{width:100%;max-width:330px;border-radius:12px;margin-top:8px;border:1px solid var(--border);display:block}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid var(--border);padding:6px 10px;border-radius:9px;font-size:12px;cursor:pointer}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:rgba(4,7,18,0.7);border-top:1px solid var(--border)}
.chip{white-space:nowrap;background:rgba(30,41,59,0.75);color:#cbd5e1;border:1px solid var(--border);padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer}
footer{padding:8px 10px;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;gap:7px;align-items:center}
#inp{flex:1;min-width:0;background:rgba(15,23,42,0.95);border:1px solid var(--border);color:#fff;padding:11px 14px;border-radius:22px;font-size:14px;outline:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(30,41,59,0.9);color:#38bdf8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sendBtn{background:var(--grad);color:#fff;border:none}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span> DARK HORIZON FILMS ✦</div>
  <div style="display:flex;gap:6px">
    <button type="button" class="pill" id="btnNew">+ جديد</button>
    <button type="button" class="pill" id="btnMem">🧠 الذاكرة</button>
  </div>
</header>
<div id="chat">
  <div class="msg bot">🚀 مرحباً بك في <b>FLUX.1-SCHNELL 1024px EXACT v14.0</b> — جميع محركات الذكاء الاصطناعي المجانية مفعّلة بالكامل!</div>
</div>
<div class="chips">
  <button type="button" class="chip" data-p="صمم صورة سيارة مستقبلية خارقة في الغروب 8K">🎨 صورة FLUX 1024px</button>
  <button type="button" class="chip" data-p="انتج فيديو سينمائي لمدينة مستقبلية بالذكاء الاصطناعي">🎬 فيديو AI حقيقي</button>
  <button type="button" class="chip" id="upRemix">🪄 تعديل صورة من هاتفي</button>
  <button type="button" class="chip" id="upAnim">🎞 تحريك صورة من هاتفي</button>
  <button type="button" class="chip" id="upLogo">🏷 رفع اللوغو</button>
</div>
<footer>
  <button type="button" class="icon-btn" id="btnAdd">+</button>
  <button type="button" class="icon-btn" id="btnMic">🎙</button>
  <input id="inp" type="text" placeholder="اكتب فكرتك، صورة، فيديو، أو كود...">
  <button type="button" class="icon-btn" id="sendBtn">➤</button>
</footer>
<input type="file" id="fMedia" accept="image/*,video/*" hidden>
<input type="file" id="fLogo" accept="image/*" hidden>
<script>
const API = "https://onrender.com";
const chat = document.getElementById("chat"), inp = document.getElementById("inp");
let logoImg = null, uploadAction = "anim";

function addMsg(html, who) {
  const d = document.createElement("div"); d.className = "msg " + (who || "bot"); d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

async function saveToPhone(url, name) {
  try {
    const a = document.createElement("a");
    a.href = url; a.download = name; a.target = "_blank";
    document.body.appendChild(a); a.click();
    setTimeout(() => a.remove(), 1500);
    addMsg("✅ جاري تنزيل الملف: <b>" + name + "</b> (إذا لم يبدأ تلقائياً اضغط مطولاً على الصورة واختر تنزيل).");
  } catch (e) { window.open(url, "_blank"); }
}

async function genImage1024(prompt) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const ac = new AbortController(); setTimeout(() => ac.abort(), 38000);
      const r = await fetch(API + "/api/image", {
        method: "POST", signal: ac.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      if (r.ok) {
        const b = await r.blob();
        if (b.size > 6000) return URL.createObjectURL(b);
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 4000));
  }
  throw new Error("flux_busy");
}

async function genVideoAI(prompt, box) {
  box.innerHTML = "🎬 جاري توليد الفيديو بالذكاء الاصطناعي الحقيقي (Wan2.1 / CogVideoX)...";
  try {
    const ac = new AbortController(); setTimeout(() => ac.abort(), 45000);
    const r = await fetch(API + "/api/video", { method: "POST", signal: ac.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }) });
    if (r.status === 200) {
      const vUrl = URL.createObjectURL(await r.blob());
      box.innerHTML = '<video class="media" src="' + vUrl + '" controls autoplay loop muted playsinline></video><div class="tools"><button type="button" class="tbtn" id="dlV">⬇️ حفظ الفيديو MP4</button></div>';
      box.querySelector("#dlV").onclick = () => saveToPhone(vUrl, "DH_AI_VIDEO_" + Date.now() + ".mp4");
      return;
    }
  } catch (e) {}
  const imgU = await genImage1024(prompt);
  await animateImageHD(imgU, box);
}

async function animateImageHD(src, box) {
  box.innerHTML = "🎞 جاري الرندر السينمائي عالي الجودة (1024px · 60FPS)...";
  const im = new Image(); im.crossOrigin = "anonymous";
  await new Promise(r => { im.onload = r; im.onerror = r; im.src = src; });
  const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
  const ctx = c.getContext("2d"), rec = new MediaRecorder(c.captureStream(60), { videoBitsPerSecond: 8000000 });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); }; rec.start();
  for (let f = 0; f < 90; f++) {
    const sc = 1 + (f / 90) * 0.14;
    ctx.save(); ctx.translate(512, 512); ctx.scale(sc, sc); ctx.translate(-512, -512);
    ctx.drawImage(im, 0, 0, 1024, 1024); ctx.restore();
    if (logoImg) ctx.drawImage(logoImg, 850, 30, 140, 140);
    await new Promise(r => setTimeout(r, 16));
  }
  rec.stop(); await new Promise(r => { rec.onstop = r; });
  const vUrl = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
  box.innerHTML = '<video class="media" src="' + vUrl + '" controls autoplay loop muted playsinline></video><div class="tools"><button type="button" class="tbtn" id="dlV">⬇️ حفظ الفيديو HD</button></div>';
  box.querySelector("#dlV").onclick = () => saveToPhone(vUrl, "DH_CINEMA_" + Date.now() + ".webm");
}

async function runPrompt(txt) {
  const q = (txt || "").trim(); if (!q) return;
  addMsg(q, "user"); inp.value = "";
  const mem = JSON.parse(localStorage.getItem("dh_mem") || "[]"); mem.unshift(q); localStorage.setItem("dh_mem", JSON.stringify(mem.slice(0, 20)));
  if (/فيديو|مشهد|video/i.test(q)) { const b = addMsg("⏳ جاري التحضير..."); await genVideoAI(q, b); return; }
  if (/صور|صورة|ارسم|صمم|image/i.test(q)) {
    const b = addMsg("🎨 جاري التوليد بدقة FLUX.1 1024×1024...");
    try {
      const u = await genImage1024(q);
      b.innerHTML = '<img class="media" src="' + u + '"><div class="tools"><button type="button" class="tbtn" id="dlI">⬇️ حفظ الصورة PNG</button><button type="button" class="tbtn" id="toV">🎬 تحويل لفيديو</button></div>';
      b.querySelector("#dlI").onclick = () => saveToPhone(u, "DH_FLUX_1024_" + Date.now() + ".png");
      b.querySelector("#toV").onclick = () => animateImageHD(u, b);
    } catch (e) { b.innerHTML = "⚠️ الخادم مشغول لحظياً، أعد المحاولة."; }
    return;
  }
  const b = addMsg("⚡ جاري التفكير (Qwen-72B)...");
  try {
    const r = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
    const d = await r.json();
    b.innerHTML = (d.reply || "").replace(/```([\s\(\S\)]*?)```/g, '<pre dir="ltr" style="background:#020617;padding:10px;border-radius:10px;overflow-x:auto;color:#38bdf8;margin:6px 0"><code>$1</code></pre>').replace(/\n/g, "<br>");
  } catch (e) { b.innerHTML = "⚡ الخادم يستيقظ الآن، أعد الإرسال بعد ثوانٍ."; }
}

document.getElementById("sendBtn").onclick = () => runPrompt(inp.value);
inp.onkeydown = e => { if (e.key === "Enter") runPrompt(inp.value); };
document.querySelectorAll(".chip[data-p]").forEach(b => { b.onclick = () => runPrompt(b.getAttribute("data-p")); });
document.getElementById("btnNew").onclick = () => { chat.innerHTML = '<div class="msg bot">✨ جلسة جديدة جاهزة في <b>FLUX.1-SCHNELL 1024px EXACT v14.0</b></div>'; };
document.getElementById("btnMem").onclick = () => {
  const m = JSON.parse(localStorage.getItem("dh_mem") || "[]");
  addMsg(m.length ? "🧠 <b>آخر طلباتك المحفوظة:</b><br>• " + m.slice(0, 6).join("<br>• ") : "🧠 الذاكرة فارغة حالياً.");
};
const fM = document.getElementById("fMedia"), fL = document.getElementById("fLogo");
document.getElementById("btnAdd").onclick = () => { uploadAction = "anim"; fM.click(); };
document.getElementById("upAnim").onclick = () => { uploadAction = "anim"; fM.accept = "image/*"; fM.click(); };
document.getElementById("upRemix").onclick = () => { uploadAction = "remix"; fM.accept = "image/*"; fM.click(); };
document.getElementById("upLogo").onclick = () => fL.click();
fM.onchange = async e => {
  const i0 = "[" + "0" + "]", f = eval("e.target.files" + i0); if (!f) return;
  const u = URL.createObjectURL(f);
  if (uploadAction === "remix") {
    const styleQ = inp.value.trim() || "futuristic neon cyberpunk cinematic portrait 8k";
    const b = addMsg("🪄 جاري تعديل صورتك بالذكاء الاصطناعي...");
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const r = await fetch(API + "/api/remix", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: rd.result, prompt: styleQ }) });
        if (r.status === 200) {
          const nu = URL.createObjectURL(await r.blob());
          b.innerHTML = '<img class="media" src="' + nu + '"><div class="tools"><button type="button" class="tbtn" id="dlR">⬇️ حفظ التعديل</button></div>';
          b.querySelector("#dlR").onclick = () => saveToPhone(nu, "DH_REMIX_" + Date.now() + ".png");
          return;
        }
      } catch (err) {}
      await animateImageHD(u, b);
    };
    rd.readAsDataURL(f);
  } else if (f.type.startsWith("image/")) { const b = addMsg("🎞 جاري تحريك صورتك..."); await animateImageHD(u, b); }
  else addMsg('<video class="media" src="' + u + '" controls autoplay loop muted playsinline></video>');
};
fL.onchange = e => {
  const i0 = "[" + "0" + "]", f = eval("e.target.files" + i0); if (!f) return;
  const im = new Image(); im.onload = () => { logoImg = im; addMsg("🏷 تم تثبيت اللوغو الخاص بك!"); }; im.src = URL.createObjectURL(f);
};
document.getElementById("btnMic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return addMsg("🎙 الصوت غير مدعوم هنا.");
  const r = new SR(); r.lang = "ar-SA"; addMsg("🎙 تحدث الآن...");
  r.onresult = e => { const i0 = "[" + "0" + "]"; inp.value = eval("e.results" + i0 + i0 + ".transcript"); runPrompt(inp.value); };
  r.start();
};
</script>
</body>
</html>
