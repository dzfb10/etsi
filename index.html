<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK HORIZON FILMS OS</title>
<script defer src="https://puter.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#050811;color:#f1f5f9;height:100dvh;display:flex;overflow:hidden}
#side{position:fixed;inset:0 auto 0 0;width:260px;background:#0a0f1d;border-right:1px solid #1e293b;z-index:90;transform:translateX(-100%);transition:.25s;display:flex;flex-direction:column;padding:14px}
#side.open{transform:translateX(0)}
.s-title{font-weight:800;color:#38bdf8;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#histList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.h-item{background:#111827;border:1px solid #1e293b;padding:10px;border-radius:10px;font-size:13px;color:#cbd5e1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;flex-direction:column;width:100%;height:100%;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(10,15,29,.96);border-bottom:1px solid #1e293b}
.h-grp{display:flex;gap:6px;align-items:center}
.brand{font-weight:900;font-size:14px;letter-spacing:.8px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.btn-top{background:#1e293b;color:#38bdf8;border:1px solid #334155;padding:6px 10px;border-radius:10px;font-size:12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.65;font-size:15px;word-wrap:break-word;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{align-self:flex-start;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;color:#e2e8f0;border-bottom-left-radius:4px;width:100%;max-width:95%}
.bot img,.bot video{width:100%;max-width:440px;border-radius:12px;margin-top:8px;display:block;cursor:zoom-in}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act-btn{background:#1e293b;color:#93c5fd;border:1px solid #334155;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#111827;border:1px solid #334155;color:#7dd3fc;padding:6px 11px;border-radius:14px;font-size:12px;cursor:pointer}
#menu{display:none;position:fixed;bottom:70px;right:12px;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:8px;flex-direction:column;gap:6px;z-index:80;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#menu.show{display:flex}
.m-item{background:transparent;color:#e2e8f0;border:none;padding:10px 12px;text-align:right;border-radius:8px;font-size:14px;cursor:pointer}
footer{padding:8px 10px;background:#090d19;border-top:1px solid #1e293b;display:flex;align-items:center;gap:6px;width:100%}
.icon-btn{width:36px;height:36px;border-radius:50%;background:#1e293b;color:#38bdf8;border:1px solid #334155;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#inp{flex:1;min-width:0;width:100%;background:#111827;border:1px solid #334155;color:#fff;padding:10px 13px;border-radius:20px;font-size:14px;outline:none;resize:none;max-height:90px;line-height:1.4}
#send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;border:none;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(56,189,248,.4)}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:120;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-width:100%;max-height:92vh;border-radius:12px}
</style>
</head>
<body>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" src=""></div>
<aside id="side">
  <div class="s-title"><span>🗂️ مشاريع الاستوديو</span><button type="button" class="btn-top" id="closeSide">✕</button></div>
  <div id="histList"></div>
</aside>
<div id="main">
  <header>
    <div class="h-grp">
      <button type="button" class="btn-top" id="newBtn">+ جديد</button>
      <button type="button" class="btn-top" id="histBtn">🗂️</button>
    </div>
    <div class="brand">✦ DARK HORIZON FILMS <span class="dot"></span></div>
  </header>
  <div id="chat">
    <div class="msg bot" dir="ltr" style="text-align:left">Welcome to <b>DARK HORIZON FILMS</b>
      
    </div>
  </div>
  <div id="menu">
    <button type="button" class="m-item" id="optImg">🎨 تصميم صورة 8K</button>
    <button type="button" class="m-item" id="optVid">🎬 إنتاج فيديو سينمائي</button>
    <button type="button" class="m-item" id="optCode">💻 كتابة كود برمجي</button>
    <button type="button" class="m-item" id="optLogo">🏷️ رفع اللوغو الخاص بي</button>
    <button type="button" class="m-item" id="optUp">🖼️ تحريك صورة من هاتفي</button>
  </div>
  <input type="file" id="logoFile" accept="image/*" hidden>
  <input type="file" id="upFile" accept="image/*" hidden>
  <footer>
    <button type="button" class="icon-btn" id="plus">+</button>
    <button type="button" class="icon-btn" id="micBtn">🎙️</button>
    <textarea id="inp" rows="1" placeholder="اكتب فكرتك، صورة، فيديو..."></textarea>
    <button type="button" id="send">➤</button>
  </footer>
</div>
<script>
const s = String.fromCharCode(47);
const API = "https:" + s + s + "dark-horizon-ai." + "onrender.com";
fetch(API + "/").catch(() => {});

const chat = document.getElementById("chat"), inp = document.getElementById("inp"), menu = document.getElementById("menu"), side = document.getElementById("side");
let sessions = JSON.parse(localStorage.getItem("dh_sessions") || "[]");

function bindChips() { document.querySelectorAll(".chip").forEach(c => c.onclick = () => { inp.value = c.dataset.p; sendMsg(); }); }
bindChips();

function saveSession(title, html) {
  if (!title) return;
  sessions.unshift({ title: title.slice(0, 36), html });
  sessions = sessions.slice(0, 15);
  localStorage.setItem("dh_sessions", JSON.stringify(sessions));
  renderHist();
}
function renderHist() {
  document.getElementById("histList").innerHTML = sessions.map((x, i) => `<div class="h-item" data-i="${i}">🎬 ${x.title}</div>`).join("");
  document.querySelectorAll(".h-item").forEach(el => el.onclick = () => { chat.innerHTML = sessions[el.dataset.i].html; side.classList.remove("open"); });
}
renderHist();

inp.oninput = () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 90) + "px"; };
document.getElementById("plus").onclick = () => menu.classList.toggle("show");
document.getElementById("histBtn").onclick = () => side.classList.toggle("open");
document.getElementById("closeSide").onclick = () => side.classList.remove("open");
document.getElementById("newBtn").onclick = () => { chat.innerHTML = '<div class="msg bot" dir="ltr" style="text-align:left">Welcome to <b>DARK HORIZON FILMS</b></div>'; };
document.getElementById("optImg").onclick = () => { menu.classList.remove("show"); inp.value = "صمم صورة "; inp.focus(); };
document.getElementById("optVid").onclick = () => { menu.classList.remove("show"); inp.value = "صمم فيديو "; inp.focus(); };
document.getElementById("optCode").onclick = () => { menu.classList.remove("show"); inp.value = "اكتب كود "; inp.focus(); };
document.getElementById("optLogo").onclick = () => { menu.classList.remove("show"); document.getElementById("logoFile").click(); };
document.getElementById("optUp").onclick = () => { menu.classList.remove("show"); document.getElementById("upFile").click(); };

document.getElementById("micBtn").onclick = function() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("المتصفح لا يدعم الإملاء الصوتي.");
  const rec = new SR(); rec.lang = "ar-SA"; this.textContent = "🔴";
  rec.onresult = e => { inp.value = e.results.transcript; sendMsg(); };
  rec.onend = () => this.textContent = "🎙️";
  rec.start();
};

document.getElementById("logoFile").onchange = e => {
  const f = e.target.files; if (!f) return;
  const r = new FileReader(); r.onload = () => { localStorage.setItem("dh_logo", r.result); addBot("✅ تم حفظ اللوغو الخاص بك!"); }; r.readAsDataURL(f);
};
document.getElementById("upFile").onchange = e => {
  const f = e.target.files; if (!f) return;
  const r = new FileReader(); r.onload = () => { const b = addBot("🎬 جاري تحريك صورتك..."); makeCinemaVideo(r.result, b, 5); }; r.readAsDataURL(f);
};

function addUser(t) { const d = document.createElement("div"); d.className = "msg user"; d.textContent = t; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; }
function addBot(html) { const d = document.createElement("div"); d.className = "msg bot"; d.innerHTML = html; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }

async function playTTS(text, btn) {
  btn.textContent = "⏳...";
  try {
    const r = await fetch(API + "/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text.slice(0, 900) }) });
    if (r.ok) { const a = new Audio(URL.createObjectURL(await r.blob())); a.play(); btn.textContent = "🔊 يعزف"; a.onended = () => btn.textContent = "🔊 استماع"; return; }
  } catch (e) {}
  btn.textContent = "🔊 استماع";
}
async function applyLogo(url) {
  const logo = localStorage.getItem("dh_logo");
  if (!logo) return url;
  try {
    const im = await new Promise(res => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
    const lm = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = logo; });
    if (!im) return url;
    const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
    const ctx = c.getContext("2d"); ctx.drawImage(im, 0, 0);
    const sz = Math.round(im.width * 0.12);
    ctx.drawImage(lm, im.width - sz - 16, im.height - sz - 16, sz, sz);
    return c.toDataURL("image/jpeg", 0.93);
  } catch (e) { return url; }
}

async function generateZeroFailImage(promptTxt, seedNum) {
  for (let tryNum = 0; tryNum < 2; tryNum++) {
    try {
      const ac = new AbortController(); setTimeout(() => ac.abort(), 28000);
      const r = await fetch(API + "/api/image", { method: "POST", signal: ac.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: promptTxt, seed: seedNum + tryNum }) });
      if (r.ok) { const b = await r.blob(); if (b.size > 4000) return URL.createObjectURL(b); }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 600));
  }
  if (window.puter && puter.ai && puter.ai.txt2img) {
    try { const imgEl = await puter.ai.txt2img(promptTxt + ", photorealistic 8k, cinematic lighting"); if (imgEl && imgEl.src) return imgEl.src; } catch (e) {}
  }
  return null;
}

async function makeCinemaVideo(imgUrl, bubble, sec) {
  const im = await new Promise(res => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => res(null); i.src = imgUrl; });
  if (!im) { bubble.innerHTML = "⚠️ تعذر معالجة الإطار."; return; }
  const W = 512, H = 512, c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: "video/webm" });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    const u = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    bubble.innerHTML = `<video src="${u}" controls autoplay loop playsinline></video><div class="actions"><a class="act-btn" href="${u}" download="DarkHorizon_Cinema.webm">⬇️ تحميل الفيلم</a></div>`;
  };
  rec.start();
  let f = 0; const total = sec * 30;
  const iv = setInterval(() => {
    const p = f / total, z = 1.0 + p * 0.12, pan = Math.sin(p * Math.PI) * -14;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(im, (W - W * z) / 2 + pan, (H - H * z) / 2, W * z, H * z);
    if (++f >= total) { clearInterval(iv); rec.stop(); }
  }, 1000 / 30);
}

async function sendMsg() {
  const val = inp.value.trim(); if (!val) return;
  inp.value = ""; inp.style.height = "auto"; menu.classList.remove("show"); addUser(val);
  const b = addBot("⚡...");

  const isIdea = /فكرة|سيناريو|idea|script/i.test(val) && !/صمم فيديو|انشئ فيديو/i.test(val);
  if (!isIdea && /صمم|ارسم|انشئ|صورة|صور|فيديو|image|video/i.test(val)) {
    const isVid = /فيديو|video/i.test(val);
    const mCount = val.match(/(\d+)\s*(?:صور|صورة|فيديوهات|فيديو|images?|videos?)/i);
    const count = mCount ? Math.min(Math.max(parseInt(mCount, 10), 1), 8) : 1;
    const mDur = val.match(/(\d+)\s*(?:ثانية|ثواني|ثوان|sec)/i);
    const sec = mDur ? Math.min(Math.max(parseInt(mDur, 10), 3), 25) : 5;

    for (let k = 0; k < count; k++) {
      const box = k === 0 ? b : addBot(`⚡ (${k + 1}/${count})...`);
      const raw = await generateZeroFailImage(val + (count > 1 ? `, variation ${k + 1}` : ""), Date.now() + k * 777);
      if (raw) {
        if (isVid) {
          await makeCinemaVideo(raw, box, sec);
        } else {
          const final = await applyLogo(raw);
          box.innerHTML = `<img class="pic" src="${final}"><div class="actions"><a class="act-btn" href="${final}" download="DH_${k + 1}.jpg">⬇️ تحميل</a><button type="button" class="act-btn fGold">🌅 ذهبي</button><button type="button" class="act-btn fNoir">🎞️ سينما</button><button type="button" class="act-btn toV">🎬 فيديو</button></div>`;
          const pic = box.querySelector(".pic");
          pic.onclick = () => { document.getElementById("lbImg").src = final; document.getElementById("lightbox").style.display = "flex"; };
          box.querySelector(".fGold").onclick = () => pic.style.filter = "contrast(1.15) saturate(1.35) sepia(0.2)";
          box.querySelector(".fNoir").onclick = () => pic.style.filter = "grayscale(1) contrast(1.3)";
          box.querySelector(".toV").onclick = () => { const vb = addBot("⚡..."); makeCinemaVideo(final, vb, sec); };
        }
      } else { box.innerHTML = "⚠️ تعذر الاتصال بالمحركات لحظياً."; }
    }
    saveSession(val, chat.innerHTML);
    return;
  }

  try {
    const r = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: val }) });
    const d = await r.json();
    const rep = d.reply || "تعذر الرد.";
    b.innerHTML = `<div>${rep.replace(/\n/g, "<br>")}</div><div class="actions"><button type="button" class="act-btn tts">🔊 استماع</button><button type="button" class="act-btn cp">📋 نسخ</button><button type="button" class="act-btn toV">🎬 حوّل لفيديو</button></div>`;
    b.querySelector(".tts").onclick = function() { playTTS(rep, this); };
    b.querySelector(".cp").onclick = function() { navigator.clipboard.writeText(rep); this.textContent = "✅"; };
    b.querySelector(".toV").onclick = async () => { const vb = addBot("🎬..."); const u = await generateZeroFailImage(rep.slice(0, 150), Date.now()); if (u) makeCinemaVideo(u, vb, 5); };
    saveSession(val, chat.innerHTML);
  } catch (e) { b.innerHTML = "⚠️ خطأ اتصال."; }
}

document.getElementById("send").onclick = sendMsg;
inp.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
</script>
</body>
</html>
