<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060913">
<script src="https://puter.com"></script>
<title>DARK HORIZON AI PRO ✦</title>
<style>
:root{--bg:#060913;--surface:rgba(15,23,42,.92);--border:rgba(148,163,184,.2);--primary:#38bdf8;--accent:#818cf8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 15% 10%,rgba(56,189,248,.16),transparent 40%),radial-gradient(circle at 85% 90%,rgba(129,140,248,.16),transparent 40%),var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:rgba(6,9,19,.95);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.new-btn{background:rgba(56,189,248,.14);color:var(--primary);border:1px solid rgba(56,189,248,.35);padding:6px 12px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.welcome{margin:auto;text-align:center;max-width:360px;padding:24px 18px;background:var(--surface);border:1px solid var(--border);border-radius:22px}
.welcome h2{font-size:20px;margin-bottom:8px}.welcome p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:rgba(30,41,59,.92);border:1px solid var(--border);color:#e2e8f0;padding:8px 12px;border-radius:12px;font-size:12.5px;cursor:pointer}
.msg{max-width:90%;padding:13px 16px;border-radius:18px;line-height:1.65;font-size:15px;word-wrap:break-word}
.user{align-self:flex-start;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-bottom-right-radius:5px}
.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.bot img,.user img,.bot video{width:100%;max-width:340px;border-radius:14px;margin-top:10px;display:block}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:rgba(56,189,248,.14);color:var(--primary);border:1px solid rgba(56,189,248,.3);border-radius:10px;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
#previewBar{display:none;margin:0 12px 8px;padding:8px 12px;background:#0f172a;border:1px solid rgba(56,189,248,.35);border-radius:12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--primary)}
.dock{padding:10px 12px 14px;background:rgba(6,9,19,.95);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;position:relative}
.icon-btn{width:44px;height:44px;border-radius:14px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#sendBtn{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#060913}
#plusBtn{background:rgba(30,41,59,.9);color:var(--primary);border:1px solid var(--border)}
.input-wrap{flex:1;background:rgba(15,23,42,.96);border:1px solid var(--border);border-radius:16px;padding:0 12px}
#q{width:100%;background:transparent;border:none;color:#fff;padding:11px 0;font-size:15px;outline:none}
#plusMenu{display:none;position:absolute;bottom:68px;left:12px;width:255px;background:#0f172a;border:1px solid var(--border);border-radius:16px;padding:7px;flex-direction:column;gap:3px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pm-item{background:transparent;border:none;color:#f1f5f9;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:right}
#appModal{display:none;position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:100;flex-direction:column}
#appModalTop{padding:10px 14px;background:#0f172a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
#appFrame{flex:1;border:none;background:#fff;width:100%}
.loader{display:inline-flex;gap:5px;padding:4px 0}.loader span{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:b 1.2s infinite}.loader span:nth-child(2){animation-delay:.2s}.loader span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> DARK HORIZON AI ✦</div>
  <button type="button" class="new-btn" id="newBtn">+ جديد</button>
</header>
<div id="chat">
  <div class="welcome" id="welcomeBox">
    <h2>DARK HORIZON AI PRO</h2>
    <p>منظومة متكاملة تجمع الخوادم الداخلية (<b>Cloudflare + HF + Groq + Gemini</b>) والخوادم الخارجية (<b>AI Horde GPU + Puter</b>) مع اللوغو الخاص بك.</p>
    <div class="chips">
      <div class="chip" data-fill="صمم صورة حصان عربي أصيل وقت الغروب">🎨 صورة واقعية 8K</div>
      <div class="chip" data-fill="صمم فيديو سباق سيارات سينمائي">🎬 فيديو سينمائي</div>
      <div class="chip" data-fill="اكتب بحثاً علمياً شاملاً عن الطاقة المتجددة">📚 بحث علمي موثق</div>
    </div>
  </div>
</div>
<div id="previewBar"><span id="prevName">📎 ملف مرفق</span><button type="button" id="clearAttBtn" style="background:none;border:none;color:#f87171;font-weight:700;cursor:pointer;font-size:15px">✕</button></div>
<input type="file" id="fileInp" style="display:none">
<div class="dock">
  <button type="button" id="sendBtn" class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  <div class="input-wrap"><input id="q" type="text" placeholder="اكتب رسالتك أو اطلب صورة، فيديو، أو بحثاً..."></div>
  <button type="button" id="plusBtn" class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <div id="plusMenu">
    <button type="button" class="pm-item" id="pickLogoBtn">🏷️ وضع اللوغو الخاص بي</button>
    <button type="button" class="pm-item" id="pickImgVidBtn">🎞️ صورة ⬅️ فيديو متحرك</button>
    <button type="button" class="pm-item" id="pickDocBtn">📄 تحليل ملف نصي / كود</button>
  </div>
</div>
<div id="appModal">
  <div id="appModalTop"><span style="color:#38bdf8;font-weight:700">🚀 تشغيل التطبيق الحي</span><button type="button" onclick="document.getElementById('appModal').style.display='none'" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">إغلاق ✕</button></div>
  <iframe id="appFrame"></iframe>
</div>
<script>
const INTERNAL_API = String.fromCharCode(104,116,116,112,115,58,47,47,100,97,114,107,45,104,111,114,105,122,111,110,45,97,105,46,111,110,114,101,110,100,101,114,46,99,111,109);
const HORDE_EXT    = String.fromCharCode(104,116,116,112,115,58,47,47,115,116,97,98,108,101,104,111,114,100,101,46,110,101,116,47,97,112,105,47,118,50);
const POLL_EXT     = String.fromCharCode(104,116,116,112,115,58,47,47,105,109,97,103,101,46,112,111,108,108,105,110,97,116,105,111,110,115,46,97,105,47,112,114,111,109,112,116,47);

const wakePing = () => fetch(INTERNAL_API + "/", { mode: "no-cors" }).catch(() => {});
wakePing(); setInterval(wakePing, 240000);

let history = [], attData = null, attType = null, attName = "";

function toggleMenu() { const m = document.getElementById("plusMenu"); m.style.display = (m.style.display === "flex") ? "none" : "flex"; }
function quickFill(t) { const q = document.getElementById("q"); q.value = t; q.focus(); document.getElementById("plusMenu").style.display = "none"; }
function clearAttach() { attData = null; attType = null; attName = ""; const fi = document.getElementById("fileInp"); if (fi) fi.value = ""; document.getElementById("previewBar").style.display = "none"; }
function addMsg(h, c) { const w = document.getElementById("welcomeBox"); if (w) w.remove(); const ch = document.getElementById("chat"); const d = document.createElement("div"); d.className = "msg " + c; d.innerHTML = h; ch.appendChild(d); ch.scrollTop = ch.scrollHeight; return d; }

async function stampUserLogo(imgUrl) {
  const logo = localStorage.getItem("dh_media_logo");
  if (!logo) return imgUrl;
  return await new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      const c = document.createElement("canvas"); c.width = 896; c.height = 896;
      const ctx = c.getContext("2d"); ctx.drawImage(im, 0, 0, 896, 896);
      const lm = new Image();
      lm.onload = () => { ctx.save(); ctx.globalAlpha = 0.92; ctx.beginPath(); ctx.roundRect(790, 790, 84, 84, 16); ctx.clip(); ctx.drawImage(lm, 790, 790, 84, 84); ctx.restore(); res(c.toDataURL("image/jpeg", 0.92)); };
      lm.onerror = () => res(imgUrl); lm.src = logo;
    };
    im.onerror = () => res(imgUrl); im.src = imgUrl;
  });
}

async function generateHybridChat(userPrompt) {
  const sys = "أنت DARK HORIZON AI، مساعد ذكاء اصطناعي خبير تتحدث بالعربية بطلاقة ووضوح. عند طلب تطبيق أو لعبة، اكتب كود HTML كامل داخل ```html ... ```.";
  try {
    const r = await fetch(INTERNAL_API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: userPrompt, messages: [{ role: "system", content: sys }, ...history.slice(-6)] })
    });
    if (r.ok) {
      const d = await r.json();
      if (d && d.reply) return d.reply;
    }
  } catch (e) {}

  try {
    if (window.puter && puter.ai && puter.ai.chat) {
      const pr = await puter.ai.chat(sys + "\n\n" + userPrompt, { model: "claude-sonnet-4" });
      const t = (typeof pr === "string") ? pr : (pr?.message?.content || String(pr));
      if (t && t.length > 1) return t;
    }
  } catch (e) {}

  return "⚠️ يرجى إعادة المحاولة بعد ثوانٍ.";
}

async function generateHybridImage(rawPrompt) {
  const clean = rawPrompt.replace(/صمم|انشئ|أنشئ|صورة|صور|ارسم|مشهد|فيديو/g, "").trim() || "majestic Arabian stallion in golden desert sunset";
  let enPrompt = clean + ", ultra photorealistic, 8k resolution, natural lighting, sharp focus, masterpiece";
  try {
    const tr = await fetch(INTERNAL_API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: "Translate this image description into a clear English prompt (18 words max, English ONLY): " + clean })
    });
    if (tr.ok) {
      const td = await tr.json();
      if (td && td.reply && td.reply.length > 4) enPrompt = td.reply.trim() + ", photorealistic 8k, sharp focus";
    }
  } catch (e) {}

  try {
    const r = await fetch(INTERNAL_API + "/api/image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: enPrompt, seed: Math.floor(Math.random() * 9999999) })
    });
    if (r.ok) {
      const b = await r.blob();
      if (b.size > 6000) return { url: await stampUserLogo(URL.createObjectURL(b)), src: "Internal-FLUX-8K" };
    }
  } catch (e) {}

  try {
    const r1 = await fetch(HORDE_EXT + "/generate/async", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": "0000000000", "Client-Agent": "DarkHorizon:4.0:user" },
      body: JSON.stringify({
        prompt: enPrompt + " ### blurry, low quality, cartoon, watermark, ugly",
        params: { sampler_name: "k_euler_a", cfg_scale: 7.5, width: 512, height: 512, steps: 20, n: 1 },
        models: ["Juggernaut XL", "EpicRealism", "AlbedoBase XL (SDXL)"],
        nsfw: false
      })
    });
    if (r1.ok) {
      const j1 = await r1.json();
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const st = await (await fetch(HORDE_EXT + "/generate/check/" + j1.id, { headers: { "Client-Agent": "DarkHorizon:4.0:user" } })).json();
        if (st && st.done) {
          const fd = await (await fetch(HORDE_EXT + "/generate/status/" + j1.id, { headers: { "Client-Agent": "DarkHorizon:4.0:user" } })).json();
          const gen = fd && fd.generations ? fd.generations.at(0) : null;
          if (gen && gen.img) {
            const rawImg = gen.img.startsWith("http") ? gen.img : ("data:image/webp;base64," + gen.img);
            return { url: await stampUserLogo(rawImg), src: "External-GPU-XL" };
          }
          break;
        }
      }
    }
  } catch (e) {}

  if (window.puter && puter.ai && puter.ai.txt2img) {
    for (const mdl of ["black-forest-labs/flux-2-pro", "google/imagen-4.0-ultra"]) {
      try {
        const el = await puter.ai.txt2img(enPrompt, { model: mdl });
        if (el && el.src) return { url: await stampUserLogo(el.src), src: mdl };
      } catch (e) {}
    }
  }
  return null;
}
async function generateHybridVideo(promptTxt, baseImg, bubble) {
  bubble.innerHTML = "🎬 جاري إنتاج الفيديو عبر الخوادم الداخلية والخارجية...";
  let frames = baseImg ? [baseImg] : [];
  if (!frames.length) {
    const s1 = await generateHybridImage(promptTxt + ", wide establishing shot");
    const s2 = await generateHybridImage(promptTxt + ", dramatic close up shot");
    if (s1 && s1.url) frames.push(s1.url);
    if (s2 && s2.url) frames.push(s2.url);
  }
  if (!frames.length) { bubble.innerHTML = "⚠️ تعذر توليد الفيديو حالياً، حاول مجدداً."; return; }

  const canvas = document.createElement("canvas"); canvas.width = 640; canvas.height = 640;
  const ctx = canvas.getContext("2d");
  const imgs = (await Promise.all(frames.map(u => new Promise(res => { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => res(im); im.onerror = () => res(null); im.src = u; })))).filter(Boolean);
  if (!imgs.length) { bubble.innerHTML = "⚠️ تعذر معالجة إطارات الفيديو."; return; }

  const stream = canvas.captureStream(24);
  const rec = new MediaRecorder(stream, { mimeType: "video/webm" });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    const vUrl = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    bubble.innerHTML = `<div>🎬 تم إنتاج الفيديو بنجاح:</div><video src="${vUrl}" controls autoplay loop playsinline></video><div class="actions"><a class="act-btn" href="${vUrl}" download="DarkHorizon_Video.webm">⬇️ تحميل الفيديو</a></div>`;
  };
  rec.start();
  let f = 0; const total = 96; const per = total / imgs.length;
  const t = setInterval(() => {
    const idx = Math.min(Math.floor(f / per), imgs.length - 1);
    const sc = 1.0 + ((f % per) / per) * 0.14;
    const w = 640 * sc, h = 640 * sc;
    ctx.clearRect(0, 0, 640, 640);
    ctx.drawImage(imgs.at(idx), (640 - w) / 2, (640 - h) * 0.22, w, h);
    if (++f >= total) { clearInterval(t); rec.stop(); }
  }, 1000 / 24);
}

async function playNeuralArabicVoice(text, btn) {
  btn.textContent = "⏳ جاري التوليد الصوتي...";
  try {
    const clean = text.replace(/[#*`]/g, "").slice(0, 1200);
    const r = await fetch(INTERNAL_API + "/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: clean, voice: "ar-SA-HamedNeural" })
    });
    if (r.ok) {
      const b = await r.blob();
      const audio = new Audio(URL.createObjectURL(b));
      audio.play();
      btn.textContent = "🔊 جاري الاستماع...";
      audio.onended = () => { btn.textContent = "🔊 استماع"; };
      return;
    }
  } catch (e) {}
  btn.textContent = "🔊 استماع";
}

async function send() {
  const inp = document.getElementById("q"), val = inp.value.trim();
  if (!val && !attData) return;
  const cd = attData, ct = attType, cn = attName;
  clearAttach(); inp.value = "";
  let uh = val ? "<div>" + val.replace(/</g, "&lt;") + "</div>" : "";
  if (ct === "img" && cd) uh += "<img src='" + cd + "'>";
  if (ct === "doc") uh += "<div style='font-size:12px;margin-top:4px'>📄 " + cn + "</div>";
  addMsg(uh, "user");
  const wait = addMsg("<div class='loader'><span></span><span></span><span></span></div>", "bot");

  if (ct === "img" && cd) { await generateHybridVideo(val || "مشهد متحرك", cd, wait); return; }
  if (/(فيديو|مشهد|حرك|video)/i.test(val)) { await generateHybridVideo(val, null, wait); return; }
  if (/(صمم|صورة|صور|ارسم|أنمي|انمي|image|draw)/i.test(val) && ct !== "doc") {
    const res = await generateHybridImage(val);
    if (res && res.url) {
      wait.innerHTML = `<div>🎨 تم التصميم بواسطة <b>${res.src}</b>:</div><img src="${res.url}"><div class="actions"><a class="act-btn" href="${res.url}" download="DarkHorizon_Pro.jpg">⬇️ تحميل الصورة</a><button type="button" class="act-btn" onclick="generateHybridVideo('${val.replace(/'/g, "")}', '${res.url}', this.closest('.msg'))">🎬 تحويل لفيديو</button></div>`;
    } else wait.innerHTML = "⚠️ تعذر التصميم حالياً، حاول مجدداً.";
    return;
  }

  let fp = (ct === "doc" && cd) ? `محتوى الملف (${cn}):\n${String(cd).slice(0, 4000)}\n\nالمطلوب: ${val || "لخّص هذا الملف"}` : val;
  history.push({ role: "user", content: fp });
  const rep = await generateHybridChat(fp);
  history.push({ role: "assistant", content: rep });

  const htmlMatch = rep.match(/```html([\s\(\S\)]*?)```/i);
  const runBtn = htmlMatch ? `<button type="button" class="act-btn run-btn" style="background:#22c55e;color:#060913">🚀 تشغيل التطبيق</button>` : "";
  wait.innerHTML = `<div class="txt-body">${rep.replace(/</g, "&lt;").replace(/\n/g, "<br>")}</div><div class="actions">${runBtn}<button type="button" class="act-btn tts-btn">🔊 استماع</button><button type="button" class="act-btn copy-btn">📋 نسخ</button><button type="button" class="act-btn save-btn">💾 حفظ</button></div>`;
  if (htmlMatch) wait.querySelector(".run-btn").onclick = () => { document.getElementById("appFrame").srcdoc = htmlMatch.at(1); document.getElementById("appModal").style.display = "flex"; };
  wait.querySelector(".tts-btn").onclick = function() { playNeuralArabicVoice(rep, this); };
  wait.querySelector(".copy-btn").onclick = function() { navigator.clipboard.writeText(rep); this.textContent = "✅ تم النسخ"; };
  wait.querySelector(".save-btn").onclick = function() { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rep], {type:"text/plain;charset=utf-8"})); a.download = "DarkHorizon_Note.txt"; a.click(); };
}

window.addEventListener("DOMContentLoaded", function() {
  document.getElementById("sendBtn").onclick = send;
  document.getElementById("plusBtn").onclick = function(e) { e.stopPropagation(); toggleMenu(); };
  document.getElementById("newBtn").onclick = function() { history = []; clearAttach(); document.getElementById("chat").innerHTML = ""; };
  document.getElementById("clearAttBtn").onclick = clearAttach;
  document.getElementById("q").onkeydown = function(e) { if (e.key === "Enter") { e.preventDefault(); send(); } };
  document.getElementById("pickLogoBtn").onclick = function() { attType = "logo"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = "image/*"; f.click(); };
  document.getElementById("pickImgVidBtn").onclick = function() { attType = "img"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = "image/*"; f.click(); };
  document.getElementById("pickDocBtn").onclick = function() { attType = "doc"; document.getElementById("plusMenu").style.display = "none"; const f = document.getElementById("fileInp"); f.accept = ".txt,.py,.js,.json,.csv,.md,.html"; f.click(); };
  document.getElementById("fileInp").onchange = function() {
    const f = this.files ? this.files.at(0) : null; if (!f) return; attName = f.name;
    const r = new FileReader();
    r.onload = function(e) {
      if (attType === "logo") { localStorage.setItem("dh_media_logo", e.target.result); addMsg("✅ تم حفظ اللوغو الخاص بك!", "bot"); attType = null; return; }
      attData = e.target.result; document.getElementById("prevName").textContent = (attType === "img" ? "🖼️ " : "📄 ") + attName; document.getElementById("previewBar").style.display = "flex";
    };
    if (attType === "doc") r.readAsText(f); else r.readAsDataURL(f);
  };
  document.querySelectorAll("[data-fill]").forEach(el => { el.onclick = function() { quickFill(this.getAttribute("data-fill")); }; });
  document.addEventListener("click", e => { if (!e.target.closest("#plusBtn") && !e.target.closest("#plusMenu")) document.getElementById("plusMenu").style.display = "none"; });
});
